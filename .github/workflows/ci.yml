name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-static-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: civicdesk_test
          POSTGRES_USER: civicdesk
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API & dev test dependencies
        run: pip install -r api/requirements-dev.txt
      - name: Run Python unit & static tests
        run: python -m unittest discover -s tests -v
      - name: Run API + Postgres integration tests
        env:
          CIVICDESK_TEST_PG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: civicdesk_test
          POSTGRES_USER: civicdesk
          POSTGRES_PASSWORD: testpassword
        run: pytest tests/api -v

  frontend-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies, run Vitest & build
        working-directory: web
        run: npm ci && npm test && npm run build
