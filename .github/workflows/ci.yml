name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-static-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: civicdesk_test
          POSTGRES_USER: civicdesk
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API & dev test dependencies
        run: pip install -r api/requirements-dev.txt
      - name: Run Python unit & static tests
        run: python -m unittest discover -s tests -v
      - name: Run API + Postgres integration tests
        env:
          CIVICDESK_TEST_PG: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: civicdesk_test
          POSTGRES_USER: civicdesk
          POSTGRES_PASSWORD: testpassword
        run: pytest tests/api -v

  frontend-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies, run Vitest & build
        working-directory: web
        run: npm ci && npm test && npm run build

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: [backend-and-static-tests, frontend-tests-and-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build production frontend & Docker images
        run: |
          cd web && npm ci && npm run build && cd ..
          docker build -t civicdesk-api:ci ./api
          docker build -t civicdesk-web:ci ./web
      - name: Boot isolated Docker stack
        run: |
          docker network create ci-net
          docker run -d --name db --network ci-net \
            -e POSTGRES_DB=civicdesk -e POSTGRES_USER=civicdesk -e POSTGRES_PASSWORD=testpassword \
            postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U civicdesk >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name api --network ci-net \
            -e POSTGRES_HOST=db -e POSTGRES_PORT=5432 -e POSTGRES_DB=civicdesk \
            -e POSTGRES_USER=civicdesk -e POSTGRES_PASSWORD=testpassword \
            -e STORAGE_BACKEND=local -e COOKIE_SECURE=false \
            civicdesk-api:ci
          docker run -d --name web --network ci-net -p 8080:80 civicdesk-web:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health >/dev/null && break; sleep 2; done
      - name: Install Playwright & run E2E suite
        working-directory: e2e
        env:
          CIVICDESK_LIVE_URL: http://localhost:8080
        run: |
          npm ci
          npx playwright install chromium --with-deps
          npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
