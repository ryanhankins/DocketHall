name: Build and Publish Images (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend bundle
        working-directory: web
        run: npm ci && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase owner & tag
        id: meta
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          build-args: |
            CIVICDESK_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/civicdesk-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/civicdesk-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/civicdesk-web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/civicdesk-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push minio
        uses: docker/build-push-action@v6
        with:
          context: ./minio
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/civicdesk-minio:${{ steps.meta.outputs.tag }}

      - name: Build and push minio-init
        uses: docker/build-push-action@v6
        with:
          context: ./minio/init
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/civicdesk-minio-init:${{ steps.meta.outputs.tag }}
