#cloud-config
# Paste into AWS Lightsail, DigitalOcean, Hetzner, Linode, or GCP Startup Script
# to provision a turnkey CivicDesk Ubuntu 22.04/24.04 server.
#
# Replace DOMAIN below with your real domain (and point its DNS A record to this VM).

runcmd:
  - |
    export DOMAIN="portal.example.gov"
    export STORAGE_BACKEND="local"
    export MINIO_REPLICAS="0"
    # Optional: export SEED_CITY_PROFILE="birchwood"
    # Optional: export MULTI_TENANT="true"
    # Optional: export TENANT_BASE_DOMAIN="civicdesk.org"
    # Optional: export RESTIC_REPOSITORY="s3:s3.us-west-004.backblazeb2.com/my-bucket/civicdesk"
    # Optional: export RESTIC_PASSWORD="change-me-strong-password"
    curl -fsSL https://raw.githubusercontent.com/ryanhankins/CivicDesk/main/scripts/install-vps.sh | bash
