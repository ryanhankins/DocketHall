# Throttle login attempts and public submission/lookup endpoints per client IP (conf.d files are included in the http block).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=public_api:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security_headers.conf;

    # PDF & backup archive uploads
    client_max_body_size 500m;

    # Resolve "api" through Swarm's DNS at request time so nginx starts even
    # if the api service isn't up yet, and follows it across restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # ---------------------------------------------------------------- public
    location = / {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location = /portal {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store";
        try_files /portal.html =404;
    }

    location = /code {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store";
        try_files /code.html =404;
    }

    # ------------------------------------------------- internal (login required)
    location = /app {
        auth_request /_auth;
        error_page 401 = @login;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store";
        try_files /app.html =404;
    }
    location = /app.html { return 302 /app; }   # never serve it unguarded

    location = /app.css {
        auth_request /_auth;
        error_page 401 = @login;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-cache";
        try_files /app.css =404;
    }

    location ^~ /js/ {
        auth_request /_auth;
        error_page 401 = @login;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location @login { return 302 /?next=/app; }

    # Session check: 2xx from /api/me allows the request, 401 denies it.
    location = /_auth {
        internal;
        proxy_pass $api_upstream/api/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # -------------------------------------------------------------------- api
    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/register {
        limit_req zone=public_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/password-reset/request {
        limit_req zone=public_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/subscriptions/subscribe {
        limit_req zone=public_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(complaints/work-orders/public|records/requests/public|calendar/reservations/public|forms/public/[^/]+/submit|notices/public/[0-9]+/respond|payments/public/bills/contest)$ {
        limit_req zone=public_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(complaints/public-lookup|complaints/work-orders/public-lookup|records/requests/public-lookup|calendar/reservations/public-lookup|payments/bills/public-lookup)$ {
        limit_req zone=public_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api_upstream;          # path (incl. /api/) passed through unchanged
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large packet PDFs and backup archives can be slow
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        proxy_request_buffering off;
    }

    location / {
        try_files $uri =404;
    }
}
