<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivicDesk — Sign in</title>
  <link rel="icon" href="/api/branding/logo">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, sans-serif; background: #f3f5f8; color: #1f2933;
    }
    form {
      width: 100%; max-width: 340px; background: #fff; padding: 2rem;
      border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 1.5rem; font-size: 1.4rem; text-align: center; }
    label { display: block; font-size: .85rem; margin-bottom: .3rem; color: #52606d; }
    input {
      width: 100%; padding: .6rem .7rem; margin-bottom: 1rem; font-size: 1rem;
      border: 1px solid #cbd2d9; border-radius: 6px;
    }
    input:focus { outline: 2px solid #2563eb; border-color: transparent; }
    button {
      width: 100%; padding: .7rem; font-size: 1rem; border: 0; border-radius: 6px;
      background: #2563eb; color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    #error { min-height: 1.2rem; margin: .8rem 0 0; color: #c81e1e; font-size: .9rem; text-align: center; }
  </style>
</head>
<body>
  <form id="login" autocomplete="on">
    <img src="/api/branding/logo" alt="" style="height:40px; width:auto; display:block; margin:0 auto .5rem;" onerror="this.style.display='none'">
    <h1><span id="login-city-title" hidden></span>CivicDesk</h1>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <div id="email-wrap" hidden>
      <label for="email">Email (optional)</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="submit-btn">Sign in</button>
    <p id="error" role="alert"></p>
    <div style="margin-top:.75rem; text-align:center; font-size:.88rem; display:flex; flex-direction:column; gap:.45rem;">
      <a href="#" id="toggle-mode" style="color:#2563eb; text-decoration:none;">Need a citizen/contractor account? Register</a>
      <a href="/portal" style="color:#52606d; text-decoration:none;">Browse Public Permits Portal &rarr;</a>
      <a href="/code" style="color:#52606d; text-decoration:none;">Browse Public City Code &rarr;</a>
    </div>
  </form>

  <script>
    const params = new URLSearchParams(location.search);
    const nextUrl = params.get('next');
    const safeNext = (nextUrl && nextUrl.startsWith('/app')) ? nextUrl : '/app';
    let registerMode = params.get('register') === '1';

    // Load public city branding title if configured.
    fetch('/api/branding')
      .then(r => r.ok ? r.json() : null)
      .then(b => {
        const title = (b?.city_title || '').trim();
        const el = document.getElementById('login-city-title');
        if (el) {
          el.textContent = title ? `${title} ` : '';
          el.hidden = !title;
        }
        document.title = title ? `${title} - CivicDesk Sign In` : 'CivicDesk Sign In';
      })
      .catch(() => {});

    // Already signed in? Go straight to the app.
    fetch('/api/me', { credentials: 'same-origin' })
      .then(r => { if (r.ok) location.replace(safeNext); });

    const form = document.getElementById('login');
    const error = document.getElementById('error');
    const button = document.getElementById('submit-btn');
    const toggle = document.getElementById('toggle-mode');
    const emailWrap = document.getElementById('email-wrap');

    function syncMode() {
      button.textContent = registerMode ? 'Create Applicant Account' : 'Sign in';
      if (emailWrap) emailWrap.hidden = !registerMode;
      form.password.autocomplete = registerMode ? 'new-password' : 'current-password';
      form.password.minLength = registerMode ? 8 : 1;
      toggle.textContent = registerMode
        ? 'Already have an account? Sign in'
        : 'Need a citizen/contractor account? Register';
      error.textContent = '';
    }
    syncMode();

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      registerMode = !registerMode;
      syncMode();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      button.disabled = true;
      try {
        const endpoint = registerMode ? '/api/register' : '/api/login';
        const r = await fetch(endpoint, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: form.username.value.trim(),
            email: registerMode ? (form.email?.value || '').trim() : undefined,
            password: form.password.value,
          }),
        });
        if (r.ok) { location.replace(safeNext); return; }
        const data = await r.json().catch(() => ({}));
        if (r.status === 429) {
          error.textContent = 'Too many attempts. Please wait a minute.';
        } else {
          error.textContent = data.detail || (registerMode ? 'Registration failed.' : 'Invalid username or password.');
        }
      } catch {
        error.textContent = 'Unable to reach the server.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
