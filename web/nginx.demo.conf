limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=public_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=heavy_pdf:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security_headers.conf;

    # Demo egress & disk protection: cap uploads at 2 MB
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # ---------------------------------------------------------------- public
    location = / {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location ~ ^/(overview|agendas|permits|codification|records|complaints|calendar|notices|blog|directory|forms|pages|pay|utilities|citations|transparency)(/.*)?$ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($http_user_agent ~* "(facebookexternalhit|Twitterbot|Slackbot|LinkedInBot|Discordbot|WhatsApp|TelegramBot|Applebot)") {
            rewrite ^(.*)$ /api/public/share-card?path=$1 break;
            proxy_pass $api_upstream;
        }
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location ~ ^/portal(/.*)?$ {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store";
        try_files /portal.html =404;
    }

    location ~ ^/code(/.*)?$ {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store";
        try_files /code.html =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-cache";
        try_files /manifest.webmanifest =404;
    }

    location = /sw.js {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-cache";
        try_files /sw.js =404;
    }

    # ------------------------------------------------- internal (login required)
    location ~ ^/app(/.*)?$ {
        auth_request /_auth;
        error_page 401 = @login;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store";
        try_files /app.html =404;
    }
    location = /app.html { return 302 /app; }

    location = /app.css {
        auth_request /_auth;
        error_page 401 = @login;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-cache";
        try_files /app.css =404;
    }

    location ^~ /js/ {
        auth_request /_auth;
        error_page 401 = @login;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location @login { return 302 /?next=$request_uri; }

    location = /_auth {
        internal;
        proxy_pass $api_upstream/api/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # -------------------------------------------------------------------- api
    location ~ ^/api/(login|demo-login)$ {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(codification/public/full\.pdf|agendas/public/[0-9]+/(packet|minutes)\.pdf|backup/export)$ {
        limit_req zone=heavy_pdf burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(register|password-reset/request|subscriptions/subscribe|complaints/public|complaints/work-orders/public|records/requests/public|calendar/reservations/public|forms/public/[^/]+/submit|notices/public/[0-9]+/respond|blog/public/posts/[0-9]+/comments|payments/public/bills/contest|complaints/public-lookup|complaints/work-orders/public-lookup|records/requests/public-lookup|calendar/reservations/public-lookup|payments/bills/public-lookup)$ {
        limit_req zone=public_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        send_timeout          60s;
    }

    location / {
        try_files $uri =404;
    }
}
